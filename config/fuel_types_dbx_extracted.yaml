store_crosscheck:   # dbx value vs data/store/fuel_types.parquet library_id='ga80'
  # (parquet READ ONLY — nothing was written back)
  n_types_in_dbx: 40
  n_present_in_store: 36
  n_absent_from_store: 4   # [E5, E6, J7, J8]
  n_store_ga80_rows_total: 70    # 34 of them feature_poor (B/C/D/A1/A3-7/G1/G2/H5/H6)
  scalar_agreement:   # dbx - store, over the 36 shared types
    kinf10: {n: 36, mean_diff: -7.2222e-06, median_abs_diff: 4.5e-05, max_abs_diff: 0.00048}
    kinf20: {n: 36, mean_diff: 0.00042722, median_abs_diff: 0.000505, max_abs_diff: 0.00068}
    kinf30: {n: 36, mean_diff: 0.00020528, median_abs_diff: 0.00026, max_abs_diff: 0.00045}
    kinf_eol50: {n: 36, mean_diff: 1.3111e-05, median_abs_diff: 6.75e-05, max_abs_diff: 0.000353}
    bu_k1: {n: 36, mean_diff: 0.0019766, median_abs_diff: 0.0066664, max_abs_diff: 0.055872}
    ff_pin_max: {n: 36, mean_diff: -0.001925, median_abs_diff: 0.003, max_abs_diff: 0.0041}
    kinf0: {n: 36, mean_diff: -0.027594, median_abs_diff: 0.027755, max_abs_diff: 0.02985}
    depletion_slope_pcm_per_gwd: {n: 36, mean_diff: -4.2413, median_abs_diff: 0.37255, max_abs_diff: 176.81}
    reactivity_swing_pcm: {n: 36, mean_diff: 47.762, median_abs_diff: 22.553, max_abs_diff: 1486.4}
  verdict: |
    kinf10 / kinf20 / kinf30 / kinf_eol50 agree to <7e-4 (<0.07 %) and bu_k1 to
    <0.056 GWd/tU (<0.15 %) on all 36 shared types — the workbook curves and the store's
    HGC harvest are the same physics.  ff_pin_max differs by <0.0041 (<0.36 %).
    kinf0 differs by -0.028 on average: a BU=0 xenon-state convention difference, not a
    disagreement (see the caveat in merge_note).
    reactivity_swing_pcm and depletion_slope_pcm_per_gwd agree to a median 23 pcm and
    0.37 pcm/GWd, with exactly ONE outlier: A8, where the STORE value (swing 11 pcm,
    slope -462) is the artefact — its hump detector latched onto a numerical ripple on the
    finer HGC grid.  The workbook grid gives A8 swing 1497 pcm / slope -639, in line with
    its siblings.  Merging this file therefore also CORRECTS one existing store row.
  fields_the_store_has_no_value_for_today:
    enr_main: {store_non_null: 0, dbx_non_null: 36}
    enr_zone: {store_non_null: 0, dbx_non_null: 36}
    gd_wt: {store_non_null: 0, dbx_non_null: 36}
    gd_u_enr: {store_non_null: 0, dbx_non_null: 36}
    zone_pin_count: {store_non_null: 0, dbx_non_null: 36}
  u_avg_enrichment: |
    The store carries the FAMILY ANCHOR from config/fuel_types_manual.yaml (A/E->5.0,
    J->5.1, K->5.2, L->5.3, N->5.4, B/G/H->5.5), identical for every member of a family.
    The workbook gives the realised per-type value; the spread inside a family reaches
    0.050 w/o (E4 5.0500 vs E3 5.0246) and the anchor is off by up to +0.050 / -0.039
    (A2 4.9610 against anchor 5.0).  n_gd agrees 36/36.

