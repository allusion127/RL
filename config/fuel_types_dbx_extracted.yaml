# fuel_types_dbx_extracted.yaml
#
# Assembly-lattice specs extracted from the READ-ONLY feasible-core database
#   data/reports/scoping_mesh_20260815/feasible_database.xlsx   (sheets P_<pair>)
# by the dbx extraction pass of 2026-08-16.  NOTHING here has been written into
# data/store/fuel_types.parquet — this file is the candidate merge payload only
# (merge recipe: see `merge_note` at the bottom of this file).
#
# Every P_<pair> sheet carries, per assembly type:
#   * a general block   (avg enrichment / role / pin zoning / Gd design)
#   * a 1/8 pin map     (DeCART dec_FA_<type>.inp) with a code legend, OR '(덱 없음)'
#   * a k-inf(BU) and pin-peaking FF(BU) depletion table on a shared 62-point grid
# The 1/8 map is lower-triangular with 8-fold symmetry: cell (i,j<=i) has
# multiplicity 4 on the diagonal and 8 off it -> 8*4 + 28*8 = 256 lattice cells
# (16x16 CE assembly: 236 fuel rods + 20 guide-tube cells).  Rod-count-weighted
# (main, zone, Gd) enrichment reproduces the sheet's stated assembly average to
# <3e-4 w/o on all 36 decked types, so the map is used to RECOVER the average
# where the sheet leaves it blank (A8, A2).

meta:
  extracted: 2026-08-16
  source_workbook: data/reports/scoping_mesh_20260815/feasible_database.xlsx
  source_sheets: P_<pair>  (20 sheets)
  library_id: ga80          # same letter roster as store library 'ga80'
  n_sheets_parsed: 20
  n_sheets_failed: 0
  n_types: 40
  n_types_new_vs_store: 4   # E5, E6, J7, J8
  n_types_with_decart_deck: 36
  db_rows_unlocked_by_new_types: 472
  read_only_inputs: [feasible_database.xlsx, data/store/fuel_types.parquet]

